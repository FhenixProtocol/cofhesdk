name: Test

on:
  pull_request:
  push:
    branches: [master, staging]
  # A maintainer adds the `run-matrix` label to a contributor's PR to run the
  # matrix on it with the testnet keys (see test-network-labeled below).
  pull_request_target:
    types: [labeled]

# The group name is the workflow name, a hyphen, then one of these:
#   push to master          -> Test-refs/heads/master
#   pull_request on PR 505  -> Test-refs/pull/505/merge
#   run-matrix label on 505 -> Test-pr-505
# The last one needs the ternary. `github.ref` is master for pull_request_target,
# which would put a labeled run in the master group and let the next push cancel it.
concurrency: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.ref }}

jobs:
  # Keyless tests: unit, mock-network, forge, and browser suites. Needs no
  # secrets, so it runs on every pull request INCLUDING fork PRs — the
  # live-chain suites in packages/sdk self-skip when TEST_PRIVATE_KEY is
  # absent (see LIVE_TESTS in the gated test files).
  test-local:
    # Skip when the run was started by the `run-matrix` label. This job needs no keys, so it already ran on the PR.
    if: github.event_name != 'pull_request_target'
    name: Test (local)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Run Tests
        run: pnpm exec turbo run test --filter='!@cofhe/integration-matrix'

  # tfhe thread-pool suites (packages/sdk/web/test: threadPoolOn/Off,
  # mainThreadPool, workerInitRace). They generate real ZK proofs on a rayon
  # pool that takes every core of the runner, so inside the fully parallel
  # "Test (local)" run they starved other proving tests into timeouts. They
  # self-skip there (see THREADPOOL_TESTS) and run here instead, one file at a
  # time. Keyless, so this also runs on fork PRs.
  test-threadpool:
    # Skip when the run was started by the `run-matrix` label. This job needs no keys, so it already ran on the PR.
    if: github.event_name != 'pull_request_target'
    name: Test (thread pool)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Run Thread Pool Tests
        env:
          TEST_THREADPOOL_ENABLED: 'true'
        run: pnpm exec turbo run test:threadpool --filter=@cofhe/sdk

  # Live-testnet suites (sdk decrypt + inherited client tests). These sign and
  # transact with the funded TEST_PRIVATE_KEY wallet, so they only run where
  # repository secrets exist: pushes and same-repo pull requests. Fork PRs
  # skip this job entirely instead of failing on a missing secret.
  test-live:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: testnet-integration
      cancel-in-progress: false
    name: Test (live testnet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Validate TEST_PRIVATE_KEY availability
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: |
          if [ -z "$TEST_PRIVATE_KEY" ]; then
            echo "TEST_PRIVATE_KEY secret is not available to this workflow run."
            echo "Common causes:"
            echo "- The secret was added under a different name, repo, org, or environment."
            echo "- The secret is environment-scoped, but this job does not declare that environment."
            exit 1
          fi

      - name: Run Live Tests
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: pnpm exec turbo run test:live --filter=@cofhe/sdk

  test-network:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: Hardhat Mock
            slug: hardhat
          - name: Ethereum Sepolia
            slug: sepolia
            setupChainId: '11155111'
          - name: Arbitrum Sepolia
            slug: arb-sepolia
            setupChainId: '421614'
          - name: Base Sepolia
            slug: base-sepolia
            setupChainId: '84532'
    concurrency:
      group: testnet-integration-${{ matrix.network.slug }}
      cancel-in-progress: false
    name: Matrix (${{ matrix.network.name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Validate TEST_PRIVATE_KEY availability
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: |
          if [ -z "$TEST_PRIVATE_KEY" ]; then
            echo "TEST_PRIVATE_KEY secret is not available to this workflow run."
            echo "Common causes:"
            echo "- The secret was added under a different name, repo, org, or environment."
            echo "- The secret is environment-scoped, but this job does not declare that environment."
            exit 1
          fi

      - name: Setup test fixtures
        if: matrix.network.setupChainId
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: pnpm --filter @cofhe/test-setup run setup -- --chains ${{ matrix.network.setupChainId }}

      - name: Run Integration Matrix Tests
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
          TEST_ALICE_PRIVATE_KEY: ${{ secrets.TEST_ALICE_PRIVATE_KEY }}
          MATRIX_CHAIN: ${{ matrix.network.slug }}
        run: pnpm exec turbo run test --filter=@cofhe/integration-matrix

  # The matrix on a contributor's PR, with the repository's testnet keys.
  # Fork PRs get no secrets on `pull_request`, so this is the only way the
  # matrix runs on them. The PR's own code runs with the keys here, so a
  # maintainer adds the label only after reading the diff.
  test-network-labeled:
    # Only when the `run-matrix` label is added. Any other label is ignored.
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'run-matrix'
    # Untrusted code runs here. The token can read the repo and nothing else.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: Hardhat Mock
            slug: hardhat
          - name: Ethereum Sepolia
            slug: sepolia
            setupChainId: '11155111'
          - name: Arbitrum Sepolia
            slug: arb-sepolia
            setupChainId: '421614'
          - name: Base Sepolia
            slug: base-sepolia
            setupChainId: '84532'
    # Same group as test-network, so this never shares a testnet wallet with
    # a master run on the same chain. Runs queue, they do not cancel.
    concurrency:
      group: testnet-integration-${{ matrix.network.slug }}
      cancel-in-progress: false
    name: Matrix on label (${{ matrix.network.name }})
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out master by default. We want the PR's code.
      # The token is not left on disk, so the PR's code cannot use it.
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Validate TEST_PRIVATE_KEY availability
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: |
          if [ -z "$TEST_PRIVATE_KEY" ]; then
            echo "TEST_PRIVATE_KEY secret is not available to this workflow run."
            echo "Common causes:"
            echo "- The secret was added under a different name, repo, org, or environment."
            echo "- The secret is environment-scoped, but this job does not declare that environment."
            exit 1
          fi

      - name: Setup test fixtures
        if: matrix.network.setupChainId
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: pnpm --filter @cofhe/test-setup run setup -- --chains ${{ matrix.network.setupChainId }}

      - name: Run Integration Matrix Tests
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
          TEST_ALICE_PRIVATE_KEY: ${{ secrets.TEST_ALICE_PRIVATE_KEY }}
          MATRIX_CHAIN: ${{ matrix.network.slug }}
        run: pnpm exec turbo run test --filter=@cofhe/integration-matrix

  # Takes the label off again. One label, one run. The next push to the PR
  # runs with the keys only after a maintainer reads it and relabels.
  remove-run-matrix-label:
    # Runs whether the legs passed or failed.
    if: always() && github.event_name == 'pull_request_target' && github.event.label.name == 'run-matrix'
    # Waits for all four legs to end.
    needs: test-network-labeled
    # The only job that can write to pull requests. None of the PR's code runs here.
    permissions:
      pull-requests: write
    name: Remove run-matrix label
    runs-on: ubuntu-latest
    steps:
      - name: Remove label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label run-matrix
