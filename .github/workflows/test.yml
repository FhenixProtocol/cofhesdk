name: Test

# What runs here, and why two jobs need the test account's key.
#
#   Job                          | Tests                                        | Chain                        | Writes       | Key
#   -----------------------------+----------------------------------------------+------------------------------+--------------+-----------------------------------------------
#   Unit, plugins, React hooks   | unit tests, Hardhat and Foundry plugins,     | none, or a local Anvil       | no           | no
#                                | React hooks on a chain                       |                              |              |
#   SDK thread pool              | the four worker-pool browser tests, serially | none                         | no           | no
#   SDK internals vs real CoFHE  | decrypt internals, share-metadata labels     | Arbitrum Sepolia             | no           | yes: the ACL lets only that account read the fixtures
#   App flows on <chain>, x4     | the integration matrix: client, encrypt,     | Anvil mocks, Ethereum,       | on testnets  | on testnets: it pays for and signs the transactions
#                                | decrypt, share, revoke, as an app uses them  | Arbitrum and Base Sepolia    |              |
#
# Fork PRs get no secrets, so the two keyed jobs skip there.

on:
  pull_request:
  push:
    branches: [master, staging]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Keyless tests: unit, mock-network, forge, and browser suites. Needs no
  # secrets, so it runs on every pull request INCLUDING fork PRs — the
  # live-chain suites in packages/sdk self-skip when TEST_PRIVATE_KEY is
  # absent (see LIVE_TESTS in the gated test files).
  test-local:
    name: Unit, plugins, React hooks (no key)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Run Tests
        run: pnpm exec turbo run test --filter='!@cofhe/integration-matrix'

  # tfhe thread-pool suites (packages/sdk/web/test: threadPoolOn/Off,
  # mainThreadPool, workerInitRace). They generate real ZK proofs on a rayon
  # pool that takes every core of the runner, so inside the fully parallel
  # "Test (local)" run they starved other proving tests into timeouts. They
  # self-skip there (see THREADPOOL_TESTS) and run here instead, one file at a
  # time. Keyless, so this also runs on fork PRs.
  test-threadpool:
    name: SDK thread pool (no key)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Run Thread Pool Tests
        env:
          TEST_THREADPOOL_ENABLED: 'true'
        run: pnpm exec turbo run test:threadpool --filter=@cofhe/sdk

  # The SDK's live suite: its decrypt internals and share-metadata labels against
  # real CoFHE on Arbitrum Sepolia. Read-only on-chain, but it signs with the
  # TEST_PRIVATE_KEY wallet, the one the ACL lets read the fixtures, so it only
  # runs where repository secrets exist: pushes and same-repo pull requests.
  # Fork PRs skip this job entirely instead of failing on a missing secret.
  test-live:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: testnet-integration
      cancel-in-progress: false
    name: SDK internals vs real CoFHE (Arbitrum Sepolia, read-only, test account)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Validate TEST_PRIVATE_KEY availability
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: |
          if [ -z "$TEST_PRIVATE_KEY" ]; then
            echo "TEST_PRIVATE_KEY secret is not available to this workflow run."
            echo "Common causes:"
            echo "- The secret was added under a different name, repo, org, or environment."
            echo "- The secret is environment-scoped, but this job does not declare that environment."
            exit 1
          fi

      - name: Run Live Tests
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: pnpm exec turbo run test:live --filter=@cofhe/sdk

  test-network:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: Anvil mocks
            slug: hardhat
          - name: Ethereum Sepolia
            slug: sepolia
            setupChainId: '11155111'
          - name: Arbitrum Sepolia
            slug: arb-sepolia
            setupChainId: '421614'
          - name: Base Sepolia
            slug: base-sepolia
            setupChainId: '84532'
    concurrency:
      group: testnet-integration-${{ matrix.network.slug }}
      cancel-in-progress: false
    name: App flows on ${{ matrix.network.name }} (${{ matrix.network.setupChainId && 'writes, test account' || 'no key' }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Validate TEST_PRIVATE_KEY availability
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: |
          if [ -z "$TEST_PRIVATE_KEY" ]; then
            echo "TEST_PRIVATE_KEY secret is not available to this workflow run."
            echo "Common causes:"
            echo "- The secret was added under a different name, repo, org, or environment."
            echo "- The secret is environment-scoped, but this job does not declare that environment."
            exit 1
          fi

      - name: Setup test fixtures
        if: matrix.network.setupChainId
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: pnpm --filter @cofhe/test-setup run setup -- --chains ${{ matrix.network.setupChainId }}

      - name: Run Integration Matrix Tests
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
          TEST_ALICE_PRIVATE_KEY: ${{ secrets.TEST_ALICE_PRIVATE_KEY }}
          MATRIX_CHAIN: ${{ matrix.network.slug }}
        run: pnpm exec turbo run test --filter=@cofhe/integration-matrix
