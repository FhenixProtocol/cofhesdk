name: Test

# What runs here, and why two jobs need the test account's key.
#
#   Job                          | Tests                                         | Chain                        | Writes       | Key
#   -----------------------------+-----------------------------------------------+------------------------------+--------------+-----------------------------------------------
#   Unit, plugins, React hooks   | unit tests, Hardhat and Foundry plugins,      | none, or a local Anvil       | no           | no
#                                | React hooks on a chain                        |                              |              |
#   SDK thread pool              | the four worker-pool browser tests, serially  | none                         | no           | no
#   SDK vs real CoFHE            | SDK internals: decrypt, share-metadata labels | Arbitrum Sepolia             | no           | yes: the ACL lets only that account read the fixtures
#   SDK vs localcofhe            | service HTTP API: teecryptor 401 codes        | localcofhe in Docker         | local only   | COFHE_READ_TOKEN: clones cofhe, pulls its images
#   Matrix: Anvil mocks          | app flows on the mocks: client, encrypt,      | a local Anvil                | no           | no
#                                | decrypt, share, revoke, as an app uses them   |                              |              |
#   Matrix: <testnet>            | the same, one leg per testnet                 | Ethereum, Arbitrum and       | yes          | yes: it pays for and signs the transactions
#                                |                                               | Base Sepolia                 |              |
#
# Fork PRs get no secrets, so the two keyed jobs skip there. A maintainer runs them on a fork PR
# by adding the `run-matrix` label: the two "on label" jobs below run the same suites with the keys.

on:
  pull_request:
  push:
    branches: [master, staging]
  # A maintainer adds the `run-matrix` label to a contributor's PR to run the
  # matrix on it with the testnet keys (see test-network-labeled below).
  pull_request_target:
    types: [labeled]

# The group name is the workflow name, a hyphen, then one of these:
#   push to master          -> Test-refs/heads/master
#   pull_request on PR 505  -> Test-refs/pull/505/merge
#   run-matrix label on 505 -> Test-pr-505
# The last one needs the ternary. `github.ref` is master for pull_request_target,
# which would put a labeled run in the master group and let the next push cancel it.
concurrency: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.ref }}

jobs:
  # Keyless tests: unit, mock-network, forge, and browser suites. Needs no
  # secrets, so it runs on every pull request INCLUDING fork PRs — the
  # live-chain suites in packages/sdk self-skip when TEST_PRIVATE_KEY is
  # absent (see LIVE_TESTS in the gated test files).
  test-local:
    # Skip when the run was started by the `run-matrix` label. This job needs no keys, so it already ran on the PR.
    if: github.event_name != 'pull_request_target'
    name: Unit, plugins, React hooks (no key)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Run Tests
        run: pnpm exec turbo run test --filter='!@cofhe/integration-matrix'

  # tfhe thread-pool suites (packages/sdk/web/test: threadPoolOn/Off,
  # mainThreadPool, workerInitRace). They generate real ZK proofs on a rayon
  # pool that takes every core of the runner, so inside the fully parallel
  # "Test (local)" run they starved other proving tests into timeouts. They
  # self-skip there (see THREADPOOL_TESTS) and run here instead, one file at a
  # time. Keyless, so this also runs on fork PRs.
  test-threadpool:
    # Skip when the run was started by the `run-matrix` label. This job needs no keys, so it already ran on the PR.
    if: github.event_name != 'pull_request_target'
    name: SDK thread pool (no key)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Run Thread Pool Tests
        env:
          TEST_THREADPOOL_ENABLED: 'true'
        run: pnpm exec turbo run test:threadpool --filter=@cofhe/sdk

  # The SDK's live suite: its decrypt internals and share-metadata labels against
  # real CoFHE on Arbitrum Sepolia. Read-only on-chain, but it signs with the
  # TEST_PRIVATE_KEY wallet, the one the ACL lets read the fixtures, so it only
  # runs where repository secrets exist: pushes and same-repo pull requests.
  # Fork PRs skip this job entirely instead of failing on a missing secret.
  test-live:
    # Only on a push, or on a pull_request from a branch of this repo. The `run-matrix` label is a
    # third kind of event and does not match. On that event test-live-labeled below runs instead.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: testnet-integration
      cancel-in-progress: false
    name: SDK vs real CoFHE (Arbitrum Sepolia, read-only, key)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Validate TEST_PRIVATE_KEY availability
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: |
          if [ -z "$TEST_PRIVATE_KEY" ]; then
            echo "TEST_PRIVATE_KEY secret is not available to this workflow run."
            echo "Common causes:"
            echo "- The secret was added under a different name, repo, org, or environment."
            echo "- The secret is environment-scoped, but this job does not declare that environment."
            exit 1
          fi

      - name: Run Live Tests
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: pnpm exec turbo run test:live --filter=@cofhe/sdk

  # The SDK against a full CoFHE stack (teecryptor, zee-k-verifier, host chain) started on the
  # runner from cofhe master, the way cofhe's own CI does. It asserts the service HTTP API the SDK
  # depends on, so a service change that breaks the SDK fails here first.
  #
  # Secret COFHE_READ_TOKEN: a classic GitHub PAT, SSO-authorized for FhenixProtocol, with
  #   - `repo`          to clone FhenixProtocol/cofhe (private) for its compose files and configs
  #   - `read:packages` to pull the prebuilt images under ghcr.io/fhenixprotocol (internal)
  # It reads only. Fork PRs get no secrets, so this job skips there.
  test-localcofhe:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    name: 'SDK vs localcofhe (cofhe master, Docker)'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The public localcofhe dev key from test/setup/src/env.ts. setup.mjs requires
      # TEST_PRIVATE_KEY even when it deploys to localcofhe only.
      TEST_PRIVATE_KEY: '0xb6b15c8cb491557369f3c7d2c287b053eb229daa9c22138887752191c9520659'
      TEST_LOCALCOFHE_PRIVATE_KEY: '0xb6b15c8cb491557369f3c7d2c287b053eb229daa9c22138887752191c9520659'
    steps:
      - name: Validate COFHE_READ_TOKEN availability
        env:
          COFHE_READ_TOKEN: ${{ secrets.COFHE_READ_TOKEN }}
        run: |
          if [ -z "$COFHE_READ_TOKEN" ]; then
            echo "COFHE_READ_TOKEN secret is not available to this workflow run."
            echo "See the comment above the test-localcofhe job for the scopes it needs."
            exit 1
          fi

      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Checkout cofhe master
        uses: actions/checkout@v5
        with:
          repository: FhenixProtocol/cofhe
          ref: master
          path: cofhe
          token: ${{ secrets.COFHE_READ_TOKEN }}
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.COFHE_READ_TOKEN }}

      # `latest` is the nightly master build, so the images can trail master's compose by a day.
      - name: Start localcofhe
        working-directory: cofhe
        run: make start-latest-cofhe TAG=latest && make wait-for-cofhe

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Build test dependencies
        run: pnpm exec turbo run build --filter=@cofhe/integration-matrix^...

      - name: Deploy SimpleTest to localcofhe
        working-directory: test/setup
        run: node setup.mjs --chains 420105

      - name: Run service API tests
        working-directory: test/integration-matrix
        env:
          MATRIX_ENV: node
          MATRIX_CHAIN: localcofhe
        run: pnpm exec vitest run --project node --reporter=verbose test/serviceApi.test.ts

      - name: Service logs on failure
        if: failure()
        working-directory: cofhe
        run: docker compose logs --tail 200 teecryptor zk-verifier contracts-deployer

  # The matrix on Anvil with the CoFHE mocks. Needs no key, so it runs on every pull request,
  # forks included. The testnet legs are the job below.
  test-network-mock:
    # Skip when the run was started by the `run-matrix` label. This job needs no keys, so it already ran on the PR.
    if: github.event_name != 'pull_request_target'
    name: 'Matrix: Anvil mocks (no key)'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Run Integration Matrix Tests
        env:
          MATRIX_CHAIN: hardhat
        run: pnpm exec turbo run test --filter=@cofhe/integration-matrix

  test-network:
    # Only on a push, or on a pull_request from a branch of this repo. The `run-matrix` label is a
    # third kind of event and does not match. On that event test-network-labeled below runs instead.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: Ethereum Sepolia
            slug: sepolia
            setupChainId: '11155111'
          - name: Arbitrum Sepolia
            slug: arb-sepolia
            setupChainId: '421614'
          - name: Base Sepolia
            slug: base-sepolia
            setupChainId: '84532'
    concurrency:
      group: testnet-integration-${{ matrix.network.slug }}
      cancel-in-progress: false
    name: 'Matrix: ${{ matrix.network.name }} (writes, key)'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Validate TEST_PRIVATE_KEY availability
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: |
          if [ -z "$TEST_PRIVATE_KEY" ]; then
            echo "TEST_PRIVATE_KEY secret is not available to this workflow run."
            echo "Common causes:"
            echo "- The secret was added under a different name, repo, org, or environment."
            echo "- The secret is environment-scoped, but this job does not declare that environment."
            exit 1
          fi

      - name: Setup test fixtures
        if: matrix.network.setupChainId
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: pnpm --filter @cofhe/test-setup run setup -- --chains ${{ matrix.network.setupChainId }}

      - name: Run Integration Matrix Tests
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
          TEST_ALICE_PRIVATE_KEY: ${{ secrets.TEST_ALICE_PRIVATE_KEY }}
          MATRIX_CHAIN: ${{ matrix.network.slug }}
        run: pnpm exec turbo run test --filter=@cofhe/integration-matrix

  # The two keyed suites on a contributor's PR, with the repository's testnet
  # keys. Fork PRs get no secrets on `pull_request`, so this is the only way
  # they run on them. The PR's own code runs with the keys here, so a
  # maintainer adds the label only after reading the diff.
  test-network-labeled:
    # Only when the `run-matrix` label is added. Any other label is ignored.
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'run-matrix'
    # Untrusted code runs here. The token can read the repo and nothing else.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        network:
          - name: Ethereum Sepolia
            slug: sepolia
            setupChainId: '11155111'
          - name: Arbitrum Sepolia
            slug: arb-sepolia
            setupChainId: '421614'
          - name: Base Sepolia
            slug: base-sepolia
            setupChainId: '84532'
    # Same group as test-network, so this never shares a testnet wallet with
    # a master run on the same chain. Runs queue, they do not cancel.
    concurrency:
      group: testnet-integration-${{ matrix.network.slug }}
      cancel-in-progress: false
    name: 'Matrix on label: ${{ matrix.network.name }} (writes, key)'
    runs-on: ubuntu-24.04
    steps:
      # pull_request_target checks out master by default. We want the PR's code.
      # The token is not left on disk, so the PR's code cannot use it.
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # actions/checkout refuses fork code in a pull_request_target run unless told so.
          # The run-matrix label is that decision, taken by a maintainer who read the diff.
          allow-unsafe-pr-checkout: true

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Validate TEST_PRIVATE_KEY availability
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: |
          if [ -z "$TEST_PRIVATE_KEY" ]; then
            echo "TEST_PRIVATE_KEY secret is not available to this workflow run."
            echo "Common causes:"
            echo "- The secret was added under a different name, repo, org, or environment."
            echo "- The secret is environment-scoped, but this job does not declare that environment."
            exit 1
          fi

      - name: Setup test fixtures
        if: matrix.network.setupChainId
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: pnpm --filter @cofhe/test-setup run setup -- --chains ${{ matrix.network.setupChainId }}

      - name: Run Integration Matrix Tests
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
          TEST_ALICE_PRIVATE_KEY: ${{ secrets.TEST_ALICE_PRIVATE_KEY }}
          MATRIX_CHAIN: ${{ matrix.network.slug }}
        run: pnpm exec turbo run test --filter=@cofhe/integration-matrix

  test-live-labeled:
    # Same gate, same permissions and same checkout as test-network-labeled above.
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'run-matrix'
    permissions:
      contents: read
    # Same group as test-live, so runs queue instead of overlapping.
    concurrency:
      group: testnet-integration
      cancel-in-progress: false
    name: SDK vs real CoFHE on label (Arbitrum Sepolia, read-only, key)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          # actions/checkout refuses fork code in a pull_request_target run unless told so.
          # The run-matrix label is that decision, taken by a maintainer who read the diff.
          allow-unsafe-pr-checkout: true

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      - name: Install Playwright Browsers
        run: cd packages/sdk && pnpm exec playwright install chromium --with-deps

      - name: Validate TEST_PRIVATE_KEY availability
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: |
          if [ -z "$TEST_PRIVATE_KEY" ]; then
            echo "TEST_PRIVATE_KEY secret is not available to this workflow run."
            echo "Common causes:"
            echo "- The secret was added under a different name, repo, org, or environment."
            echo "- The secret is environment-scoped, but this job does not declare that environment."
            exit 1
          fi

      - name: Run Live Tests
        env:
          TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
        run: pnpm exec turbo run test:live --filter=@cofhe/sdk

  # Takes the label off again. One label, one run. The next push to the PR
  # runs with the keys only after a maintainer reads it and relabels.
  remove-run-matrix-label:
    # Runs whether the legs passed or failed.
    if: always() && github.event_name == 'pull_request_target' && github.event.label.name == 'run-matrix'
    # Waits for the three matrix legs and the live suite to end.
    needs: [test-network-labeled, test-live-labeled]
    # The only job that can write to pull requests. None of the PR's code runs here.
    permissions:
      pull-requests: write
    name: Remove run-matrix label
    runs-on: ubuntu-24.04
    steps:
      - name: Remove label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label run-matrix
